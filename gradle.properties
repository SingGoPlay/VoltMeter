# 通用构建配置
# 设备端特有的设置（Android 手机上编译需要的 aapt2/qemu 相关项）放在
# GRADLE_USER_HOME/gradle.properties 里，不进仓库；CI 上是 x86_64，用官方 aapt2 即可。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.daemon.jvmargs=-Xmx1536m -Djava.net.preferIPv4Stack=true
kotlin.compiler.execution.strategy=in-process
